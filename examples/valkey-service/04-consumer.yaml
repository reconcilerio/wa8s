---
apiVersion: knative.wa8s.reconciler.io/v1alpha1
kind: ServiceTrigger
metadata:
  name: incrementor
spec:
  ref:
    name: http-incrementor
  hostCapabilities:
    network:
      inherit: true
      ipNameLookup: true
    wasmOptions:
      - name: component-model-map
      - name: component-model-implements
      - name: component-model-threading

---
apiVersion: wa8s.reconciler.io/v1alpha1
kind: Composition
metadata:
  name: http-incrementor
spec:
  dependencies:
    - component: componentized:http-incrementor
      oci:
        image: ghcr.io/componentized/valkey/sample-http-incrementor:0.3.0-dev@sha256:7518e685e94b16b76dd4fe7479eb3cb959adf0154bf3951222807f47163b54d7
    - component: componentized:valkey-client
      ref:
        apiVersion: x.services.wa8s.reconciler.io/v1alpha1
        kind: ValkeyClient
        name: my-valkey
    - component: componentized:logging
      ref:
        kind: ClusterComponent
        name: wa8s-services-logging
